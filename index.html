<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>index.html - Scene 1 & Karaoke Caption</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --outer-bg: #111827;
      --stage-bg: #111827; /* আপনার ব্যাকগ্রাউন্ড */
      --card-bg: #ffffff;
      --accent-green: #0f9d76;
      --accent-yellow: #ffd24c;
      --text-light: #f9fafb;
      --text-muted-light: #cbd5e1;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      --caption-bg-alpha: 0.24;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: var(--outer-bg);
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      color: var(--text-light);
      padding: 16px;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 1040px;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      background-color: var(--stage-bg);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65);
    }

    .scene {
      position: absolute;
      inset: 0;
      padding: 32px 44px 116px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.5s var(--ease-out), transform 0.65s var(--ease-out);
      pointer-events: none;
    }

    .scene.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .grid-2 {
      width: 100%;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 28px;
      align-items: center;
    }

    /* Slide & Stagger Entrance */
    .stagger {
      opacity: 0;
      transform: translateY(20px) translateX(-10px);
      transition: opacity 0.55s var(--ease-out), transform 0.65s var(--ease-out);
    }

    .scene.active .stagger {
      opacity: 1;
      transform: translateY(0) translateX(0);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 157, 118, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #34d399;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      margin-bottom: 10px;
      transition-delay: 0.08s;
    }

    .hero-title {
      font-size: clamp(1.75rem, 3.1vw, 2.7rem);
      line-height: 1.24;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 10px;
      transition-delay: 0.16s;
    }

    /* Yellow Highlight Accent */
    .hl {
      position: relative;
      display: inline-block;
      color: var(--text-dark);
      z-index: 1;
      padding: 0 4px;
    }

    .hl::after {
      content: "";
      position: absolute;
      left: -2px;
      right: -2px;
      bottom: 2px;
      height: 82%;
      background: var(--accent-yellow);
      z-index: -1;
      border-radius: 6px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.6s var(--ease-out) 0.32s;
    }

    .scene.active .hl::after {
      transform: scaleX(1);
    }

    .sub-copy {
      font-size: 1rem;
      color: var(--text-muted-light);
      line-height: 1.5;
      margin-bottom: 16px;
      transition-delay: 0.24s;
    }

    /* Progress Fill & Matrix Grid */
    .metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      transition-delay: 0.32s;
    }

    .metric-card {
      background: var(--card-bg);
      color: var(--text-dark);
      border-radius: 14px;
      padding: 11px 14px;
      box-shadow: var(--shadow);
      transition: transform 0.35s var(--ease-out);
    }

    .metric-card:hover {
      transform: scale(1.03);
    }

    .metric-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 99px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #0f9d76, #10b981);
      transition: width 1.2s var(--ease-out) 0.4s;
    }

    .scene.active .progress-fill {
      width: 99%;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }

    .matrix-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: #cbd5e1;
      transform: scale(0.6);
      transition: background-color 0.25s ease, transform 0.25s var(--ease-out);
    }

    .matrix-dot.on {
      background: #0f9d76;
      transform: scale(1);
    }

    /* Right Panel: Search Mock + Cross (X) + Typing Popup */
    .right-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition-delay: 0.25s;
    }

    .search-mock {
      position: relative;
      background: var(--card-bg);
      color: var(--text-dark);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      transform: scale(0.96);
      transition: transform 0.55s var(--ease-out) 0.25s;
    }

    .scene.active .search-mock {
      transform: scale(1);
    }

    .search-bar {
      height: 38px;
      border-radius: 10px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      color: var(--text-dark);
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 17px;
      background: var(--accent-green);
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .skeleton-line {
      height: 9px;
      border-radius: 99px;
      background: #e2e8f0;
      margin-bottom: 9px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.45s var(--ease-out);
    }

    .scene.active .skeleton-line {
      transform: scaleX(1);
    }

    .cross-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .cross-line {
      stroke-dasharray: 460;
      stroke-dashoffset: 460;
      transition: stroke-dashoffset 0.7s var(--ease-out) 0.5s;
    }

    .scene.active .cross-line {
      stroke-dashoffset: 0;
    }

    .result-popup {
      background: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      border-radius: 14px;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(16px) scale(0.95);
      transition: opacity 0.45s var(--ease-out) 0.85s, transform 0.5s var(--ease-out) 0.85s;
    }

    .scene.active .result-popup {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* নিচ থেকে প্রায় ১ ইঞ্চি (~96px) ওপরে কারাওকে ক্যাপশন বক্স */
    #bottom-caption {
      position: absolute;
      left: 50%;
      bottom: clamp(56px, 1in, 104px);
      transform: translateX(-50%);
      width: min(88%, 820px);
      padding: 10px 20px;
      border-radius: 14px;
      background: rgba(15, 23, 42, var(--caption-bg-alpha));
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 8px;
      z-index: 20;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .cap-word {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: clamp(0.98rem, 1.75vw, 1.25rem);
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
      transition: background-color 0.18s ease, color 0.18s ease, transform 0.2s var(--ease-out);
    }

    .cap-word.spoken {
      color: #f8fafc;
      opacity: 0.92;
    }

    .cap-word.active-word {
      background-color: var(--accent-yellow);
      color: #0f172a;
      text-shadow: none;
      transform: translateY(-2px) scale(1.04);
    }

    #bottom-caption.no-highlight .cap-word.active-word {
      background-color: transparent;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
      transform: none;
    }

    /* প্রোগ্রেস বার ও কন্ট্রোল প্যানেল */
    .hud-bar {
      width: 100%;
      max-width: 1040px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 30;
    }

    .progress-wrap {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #0f9d76, #ffd24c);
      border-radius: 999px;
      transition: width 0.25s linear;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .counter-badge {
      background: rgba(255, 255, 255, 0.1);
      color: #f9fafb;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1f2937;
      color: #f9fafb;
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn:hover {
      background: #374151;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.primary {
      background: #0f9d76;
      color: #ffffff;
      border-color: transparent;
    }

    .btn.primary:hover {
      background: #0c8262;
    }

    .btn.active-toggle {
      background: #ffd24c;
      color: #0f172a;
      border-color: transparent;
    }

    .dropper-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <section class="scene active" id="scene1" data-scene="0">
      <div class="grid-2">
        <div>
          <span class="badge stagger">AI Search Revolution</span>
          <h1 class="hero-title stagger">তুমি এখনো গুগলে <span class="hl">১০টা লিংক</span> ঘাঁটো?</h1>
          <p class="sub-copy stagger">সরাসরি উত্তর, দ্রুত বিশ্লেষণ ও স্মার্ট রেজাল্ট—পুরনো সার্চের ধরণ এখন বদলে যাচ্ছে।</p>

          <div class="metrics-row stagger">
            <div class="metric-card">
              <div class="metric-top">
                <span>Speed</span>
                <span id="speedVal">25%</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill"></div>
              </div>
            </div>

            <div class="metric-card">
              <div class="metric-top">
                <span>Matrix Index</span>
                <span id="matrixVal">1x</span>
              </div>
              <div class="matrix-grid" id="matrixGrid"></div>
            </div>
          </div>
        </div>

        <div class="right-stack stagger">
          <div class="search-mock">
            <div class="search-bar">
              <span>🔍</span>
              <span id="typedText"></span>
              <span class="cursor"></span>
            </div>
            <div class="skeleton-line" style="width: 92%; transition-delay: 0.15s;"></div>
            <div class="skeleton-line" style="width: 78%; transition-delay: 0.25s;"></div>
            <div class="skeleton-line" style="width: 86%; transition-delay: 0.35s;"></div>
            <div class="skeleton-line" style="width: 66%; transition-delay: 0.45s;"></div>

            <svg class="cross-svg" viewBox="0 0 400 210">
              <line class="cross-line" x1="50" y1="20" x2="350" y2="190" stroke="#0f9d76" stroke-width="10" stroke-linecap="round" />
              <line class="cross-line" x1="350" y1="20" x2="50" y2="190" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
            </svg>
          </div>

          <div class="result-popup">
            <span>⚡ Instant Verified Answer Ready</span>
            <strong style="color: #ffd24c;">10x Faster</strong>
          </div>
        </div>
      </div>
    </section>

    <!-- নিচ থেকে প্রায় ১ ইঞ্চি ওপরে কারাওকে ক্যাপশন বক্স -->
    <div id="bottom-caption" aria-live="polite"></div>
  </div>

  <!-- কাউন্টার, প্রোগ্রেস বার ও কন্ট্রোল বাটন -->
  <div class="hud-bar">
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="controls-row">
      <span class="counter-badge" id="counter">01 / 10</span>

      <div class="btn-group">
        <button class="btn active-toggle" id="highlightBtn" type="button">✨ হাইলাইট: চালু</button>
        <button class="btn" id="dropperBtn" type="button">💧 ড্রপার রঙ</button>
        <input type="color" id="colorPicker" class="dropper-input" value="#ffd24c" />
        <button class="btn primary" id="replayBtn" type="button">↻ Replay</button>
      </div>
    </div>
  </div>

  <script>
    const totalSteps = 10;
    const voiceoverLines = [
      "তুমি এখনো গুগলে দশটা লিংক ঘাঁটো?",
      "পুরনো সার্চের ধরণ এখন দ্রুত বদলে যাচ্ছে।",
      "সরাসরি উত্তর পেতে নতুন এআই টুল ব্যবহার করো।",
      "সোর্স ও রেফারেন্সসহ নির্ভুল তথ্য পাওয়া যায়।",
      "কোড, লেখা ও বিশ্লেষণ এখন অনেক সহজ।",
      "ছবি ও তথ্য একসাথে বোঝার সুবিধা যুক্ত হয়েছে।",
      "একাধিক মডেলের শক্তি এক জায়গায় পাওয়া যাচ্ছে।",
      "কাজের গতি এক গুণ থেকে দশ গুণ বেড়েছে।",
      "সময় বাঁচিয়ে মূল কাজে ফোকাস করা সম্ভব।",
      "স্মার্ট সার্চের এই নতুন যুগে এখনই যুক্ত হও।"
    ];

    const scene1 = document.getElementById('scene1');
    const matrixGrid = document.getElementById('matrixGrid');
    const speedVal = document.getElementById('speedVal');
    const matrixVal = document.getElementById('matrixVal');
    const typedText = document.getElementById('typedText');
    const bottomCaption = document.getElementById('bottom-caption');
    const counterEl = document.getElementById('counter');
    const progressBar = document.getElementById('progressBar');
    const replayBtn = document.getElementById('replayBtn');
    const highlightBtn = document.getElementById('highlightBtn');
    const dropperBtn = document.getElementById('dropperBtn');
    const colorPicker = document.getElementById('colorPicker');

    let currentStep = 0;
    let highlightEnabled = true;
    let wordTimer = null;

    // ২৪টি ডট নিয়ে ম্যাট্রিক্স তৈরি
    const totalDots = 24;
    for (let i = 0; i < totalDots; i++) {
      const dot = document.createElement('div');
      dot.className = 'matrix-dot';
      matrixGrid.appendChild(dot);
    }
    const dots = Array.from(document.querySelectorAll('.matrix-dot'));

    function animateCounter(el, start, end, duration, suffix = '', decimals = 0) {
      const startTime = performance.now();
      function step(now) {
        const p = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        const current = start + (end - start) * eased;
        el.textContent = current.toFixed(decimals) + suffix;
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function typeQuery(text, delayMs = 250) {
      typedText.textContent = '';
      let idx = 0;
      setTimeout(() => {
        const timer = setInterval(() => {
          typedText.textContent += text[idx];
          idx++;
          if (idx >= text.length) clearInterval(timer);
        }, 55);
      }, delayMs);
    }

    function updateProgress(stepIdx, wordRatio = 0) {
      const base = stepIdx / totalSteps;
      const slice = (1 / totalSteps) * wordRatio;
      const pct = Math.min(100, Math.max(10, (base + slice) * 100));
      progressBar.style.width = `${pct}%`;
    }

    function renderKaraokeLine(text, stepIdx) {
      clearTimeout(wordTimer);
      bottomCaption.innerHTML = '';

      const words = text.split(/\s+/).filter(Boolean);
      const wordSpans = words.map((w) => {
        const span = document.createElement('span');
        span.className = 'cap-word';
        span.textContent = w;
        bottomCaption.appendChild(span);
        return span;
      });

      if (!wordSpans.length) return;

      let wIdx = 0;
      const intervalMs = 280;

      function stepWord() {
        wordSpans.forEach((el, i) => {
          el.classList.remove('active-word');
          el.classList.toggle('spoken', i < wIdx);
        });

        if (wIdx < wordSpans.length) {
          wordSpans[wIdx].classList.add('active-word');
          updateProgress(stepIdx, (wIdx + 1) / wordSpans.length);
          wIdx++;
          wordTimer = setTimeout(stepWord, intervalMs);
        } else {
          updateProgress(stepIdx, 1);
        }
      }

      stepWord();
    }

    function playSceneAndStep(stepIdx) {
      currentStep = ((stepIdx % totalSteps) + totalSteps) % totalSteps;

      scene1.classList.remove('active');
      dots.forEach(d => d.classList.remove('on'));
      speedVal.textContent = '25%';
      matrixVal.textContent = '1x';
      typedText.textContent = '';

      void scene1.offsetWidth;
      scene1.classList.add('active');

      animateCounter(speedVal, 25, 99, 1200, '%', 0);
      animateCounter(matrixVal, 1, 10, 1200, 'x', 0);
      typeQuery('Best AI tools for fast answers...', 300);

      dots.forEach((dot, i) => {
        setTimeout(() => {
          dot.classList.add('on');
        }, 350 + i * 35);
      });

      counterEl.textContent = `${String(currentStep + 1).padStart(2, '0')} / ${String(totalSteps).padStart(2, '0')}`;
      renderKaraokeLine(voiceoverLines[currentStep], currentStep);
    }

    replayBtn.addEventListener('click', () => {
      playSceneAndStep((currentStep + 1) % totalSteps);
    });

    highlightBtn.addEventListener('click', () => {
      highlightEnabled = !highlightEnabled;
      bottomCaption.classList.toggle('no-highlight', !highlightEnabled);
      highlightBtn.classList.toggle('active-toggle', highlightEnabled);
      highlightBtn.textContent = highlightEnabled ? '✨ হাইলাইট: চালু' : '✨ হাইলাইট: বন্ধ';
    });

    dropperBtn.addEventListener('click', async () => {
      if ('EyeDropper' in window) {
        try {
          const eyeDropper = new EyeDropper();
          const result = await eyeDropper.open();
          document.documentElement.style.setProperty('--accent-yellow', result.sRGBHex);
          colorPicker.value = result.sRGBHex;
          return;
        } catch (_) {}
      }
      colorPicker.click();
    });

    colorPicker.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--accent-yellow', e.target.value);
    });

    playSceneAndStep(0);
  </script>
</body>
</html>
