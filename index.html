<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>index.html - Tap-to-Toggle Auto-Play AI & Smart Scanning (10 Scenes)</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --outer-bg: #111827;
      --stage-bg: #111827;
      --card-bg: #ffffff;
      --accent-green: #0f9d76;
      --accent-cyan: #22d3ee;
      --accent-yellow: #ffd24c;
      --text-light: #f9fafb;
      --text-muted-light: #cbd5e1;
      --text-dark: #0f172a;
      --caption-bg-alpha: 0.24;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --sync-duration: 2.2s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: var(--outer-bg);
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      color: var(--text-light);
      padding: 16px;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 1040px;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      background-color: var(--stage-bg);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .tap-indicator {
      position: absolute;
      top: 16px;
      right: 18px;
      z-index: 25;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f9fafb;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.22s ease, transform 0.22s var(--ease-out);
      pointer-events: none;
    }

    .tap-indicator.show {
      opacity: 1;
      transform: translateY(0);
    }

    .scene {
      position: absolute;
      inset: 0;
      padding: 32px 44px 118px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity calc(var(--sync-duration) * 0.22) var(--ease-out),
                  transform calc(var(--sync-duration) * 0.28) var(--ease-out);
      pointer-events: none;
    }

    .scene.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .grid-2 {
      width: 100%;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 28px;
      align-items: center;
    }

    .stagger {
      opacity: 0;
      transform: translateY(18px) translateX(-8px);
      transition: opacity calc(var(--sync-duration) * 0.24) var(--ease-out),
                  transform calc(var(--sync-duration) * 0.30) var(--ease-out);
    }

    .scene.active .stagger {
      opacity: 1;
      transform: translateY(0) translateX(0);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 157, 118, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #34d399;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      margin-bottom: 10px;
      transition-delay: calc(var(--sync-duration) * 0.03);
    }

    .hero-title {
      font-size: clamp(1.7rem, 3vw, 2.55rem);
      line-height: 1.24;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 10px;
      transition-delay: calc(var(--sync-duration) * 0.08);
    }

    .hl {
      position: relative;
      display: inline-block;
      color: var(--text-dark);
      z-index: 1;
      padding: 0 5px;
    }

    .hl::after {
      content: "";
      position: absolute;
      left: -2px;
      right: -2px;
      bottom: 2px;
      height: 82%;
      background: var(--accent-yellow);
      z-index: -1;
      border-radius: 6px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform calc(var(--sync-duration) * 0.28) var(--ease-out) calc(var(--sync-duration) * 0.16);
    }

    .scene.active .hl::after {
      transform: scaleX(1);
    }

    .sub-copy {
      font-size: 0.98rem;
      color: var(--text-muted-light);
      line-height: 1.5;
      margin-bottom: 16px;
      transition-delay: calc(var(--sync-duration) * 0.12);
    }

    .white-card {
      position: relative;
      background: var(--card-bg);
      color: var(--text-dark);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .dark-popup {
      background: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      border-radius: 14px;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(14px) scale(0.95);
      transition: opacity calc(var(--sync-duration) * 0.24) var(--ease-out) calc(var(--sync-duration) * 0.72),
                  transform calc(var(--sync-duration) * 0.28) var(--ease-out) calc(var(--sync-duration) * 0.72);
    }

    .scene.active .dark-popup {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .scan-beam {
      position: absolute;
      left: 0;
      right: 0;
      top: 4%;
      height: 4px;
      background: linear-gradient(90deg, transparent, #0f9d76, #22d3ee, #0f9d76, transparent);
      box-shadow: 0 0 16px rgba(34, 211, 238, 0.85);
      opacity: 0;
    }

    .scene.active .scan-beam {
      animation: laserScan calc(var(--sync-duration) * 0.85) var(--ease-out) calc(var(--sync-duration) * 0.12) forwards;
    }

    @keyframes laserScan {
      0% { top: 4%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 94%; opacity: 0; }
    }

    .metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      transition-delay: calc(var(--sync-duration) * 0.15);
    }

    .metric-card {
      background: var(--card-bg);
      color: var(--text-dark);
      border-radius: 14px;
      padding: 11px 14px;
    }

    .metric-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 99px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #0f9d76, #10b981);
      transition: width calc(var(--sync-duration) * 0.80) var(--ease-out) calc(var(--sync-duration) * 0.18);
    }

    .scene.active .progress-fill {
      width: 99%;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }

    .matrix-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: #cbd5e1;
      transform: scale(0.6);
      transition: background-color 0.2s ease, transform 0.2s var(--ease-out);
    }

    .matrix-dot.on {
      background: #0f9d76;
      transform: scale(1);
    }

    .skeleton-line {
      height: 9px;
      border-radius: 99px;
      background: #e2e8f0;
      margin-bottom: 10px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform calc(var(--sync-duration) * 0.22) var(--ease-out);
    }

    .scene.active .skeleton-line {
      transform: scaleX(1);
    }

    .cross-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .cross-line {
      stroke-dasharray: 460;
      stroke-dashoffset: 460;
      transition: stroke-dashoffset calc(var(--sync-duration) * 0.35) var(--ease-out) calc(var(--sync-duration) * 0.36);
    }

    .scene.active .cross-line {
      stroke-dashoffset: 0;
    }

    .doc-frame {
      position: relative;
      border: 2px dashed #94a3b8;
      border-radius: 14px;
      padding: 16px;
      background: #f8fafc;
      margin-bottom: 4px;
    }

    .corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: #0f9d76;
      border-style: solid;
    }
    .corner.tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-radius: 6px 0 0 0; }
    .corner.tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-radius: 0 6px 0 0; }
    .corner.bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-radius: 0 0 0 6px; }
    .corner.br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0; }

    .ocr-box {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
    }

    .ocr-pill {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      background: #e6f7f2;
      color: #0f9d76;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .hub-svg {
      width: 100%;
      height: 215px;
    }

    .hub-line {
      stroke-dasharray: 160;
      stroke-dashoffset: 160;
      transition: stroke-dashoffset calc(var(--sync-duration) * 0.55) var(--ease-out) calc(var(--sync-duration) * 0.20);
    }

    .scene.active .hub-line {
      stroke-dashoffset: 0;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .mini-table td {
      padding: 8px 6px;
      border-bottom: 1px solid #e2e8f0;
    }

    .code-box {
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #f1f5f9;
      border-radius: 10px
