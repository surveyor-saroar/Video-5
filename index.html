<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centered Flexbox Background</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;     /* অনুভূমিকভাবে (Horizontal) মাঝে রাখে */
      justify-content: center; /* উল্লম্বভাবে (Vertical) মাঝে রাখে */
      background-color: #111827;
      color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div>
    <!-- আপনার কন্টেন্ট এখানে থাকবে -->
    <h1>কন্টেন্ট এখন স্ক্রিনের মাঝে</h1>
  </div>

</body>
</html>
