<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>index.html - Fullscreen Blue Sunburst</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 50% 25%, transparent 35%, rgba(6, 18, 58, 0.65) 100%),
        repeating-conic-gradient(
          from 0deg at 50% 0%,
          #1D5FD6 0deg 5deg,
          #0E3596 5deg 10deg
        );
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <section class="scene active" data-scene="0">
      <!-- আপনার সিন ১-এর কন্টেন্ট এখানে যুক্ত হবে -->
    </section>
  </div>

  <script>
    const stage = document.getElementById('stage');
  </script>
</body>
</html>
