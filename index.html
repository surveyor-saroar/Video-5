<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>index.html - Center Sunburst 50% Opacity</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #06123a; /* বেস ডার্ক ব্যাকগ্রাউন্ড */
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* সেন্টার থেকে চারদিকে ছড়ানো ৫০% অপাসিটির সানবার্স্ট লেয়ার */
    .sunburst-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0.5;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, transparent 25%, rgba(6, 18, 58, 0.7) 100%),
        repeating-conic-gradient(
          from 0deg at 50% 50%,
          #1D5FD6 0deg 6deg,
          #0E3596 6deg 12deg
        );
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="sunburst-bg"></div>

  <div class="stage" id="stage">
    <section class="scene active" data-scene="0">
      <!-- আপনার সিন ১-এর কন্টেন্ট এখানে যুক্ত হবে (পূর্ণ ১০০% অপাসিটিতে থাকবে) -->
    </section>
  </div>

  <script>
    const stage = document.getElementById('stage');
  </script>
</body>
</html>
