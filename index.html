<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>index.html - Data Analytics & Binary Background</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #1949a3 0%, #0d2e73 60%, #081e4d 100%);
      font-family: 'Courier New', monospace, system-ui, sans-serif;
    }

    /* ডাটা চার্ট ও বাইনারি ব্যাকগ্রাউন্ড লেয়ার */
    .data-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      opacity: 0.42;
    }

    .data-bg svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="data-bg" aria-hidden="true">
    <svg viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
      <g fill="rgba(220, 238, 255, 0.55)" font-size="16" letter-spacing="4">
        <text x="40" y="70">101 001 01001 0101 10 01 11 1001 10 010 01 0101</text>
        <text x="60" y="190">10 1 001 0001 1101 10 01 00 01 11 010 000 10 10 100</text>
        <text x="35" y="310">101 001 01001 0101 10 01 11 1001 10 010 01 0101</text>
        <text x="65" y="430">10 1 001 0001 1101 10 01 00 01 11 010 000 10 10 100</text>
        <text x="40" y="550">101 001 01001 0101 10 01 11 1001 10 010 01 0101</text>
        <text x="50" y="645">10 101 001 01001 0101 10 01 11 1001 10 010 01 0101</text>
      </g>

      <g stroke="rgba(220, 238, 255, 0.45)" fill="none" stroke-width="2">
        <!-- Bar Chart Left -->
        <rect x="90" y="40" width="220" height="110" rx="4" />
        <rect x="115" y="105" width="16" height="45" fill="rgba(220,238,255,0.25)" />
        <rect x="142" y="85" width="16" height="65" fill="rgba(220,238,255,0.25)" />
        <rect x="169" y="65" width="16" height="85" fill="rgba(220,238,255,0.25)" />
        <rect x="196" y="92" width="16" height="58" fill="rgba(220,238,255,0.25)" />
        <rect x="223" y="55" width="16" height="95" fill="rgba(220,238,255,0.25)" />

        <!-- Line Graph Center -->
        <polyline points="420,140 470,95 520,115 580,50 640,85" stroke-width="2.5" />
        <polyline points="180,360 230,280 280,320 340,240 400,295" />

        <!-- Pie Chart Top Right -->
        <circle cx="940" cy="85" r="58" />
        <path d="M940,85 L940,27 A58,58 0 0,1 995,62 Z" fill="rgba(220,238,255,0.32)" />
        <path d="M940,85 L995,62 A58,58 0 0,1 968,136 Z" fill="rgba(220,238,255,0.18)" />

        <!-- Bottom Left Axes -->
        <polyline points="150,470 150,610 380,610" stroke-width="3" />
        <polyline points="165,570 220,515 275,545 340,485" />
      </g>

      <g fill="rgba(235, 245, 255, 0.55)" font-family="sans-serif" font-weight="700">
        <text x="620" y="290" font-size="64">$</text>
        <text x="690" y="360" font-size="44">$</text>
        <text x="555" y="385" font-size="38">$</text>
        <text x="1025" y="55" font-size="18">15%</text>
        <text x="1010" y="135" font-size="18">5%</text>
        <text x="955" y="185" font-size="18">35%</text>
      </g>
    </svg>
  </div>

  <div class="stage" id="stage">
    <section class="scene active" data-scene="0">
      <!-- আপনার সিন ১-এর কন্টেন্ট এখানে যুক্ত হবে -->
    </section>
  </div>

  <script>
    const stage = document.getElementById('stage');
  </script>
</body>
</html>
