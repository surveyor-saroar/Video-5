<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>index.html - Watercolor Background</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #eef4f7;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ওয়াটারকালার আভা ব্যাকগ্রাউন্ড লেয়ার */
    .watercolor-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background:
        radial-gradient(circle at 72% 38%, rgba(126, 107, 214, 0.58) 0%, transparent 38%),
        radial-gradient(circle at 65% 68%, rgba(74, 123, 216, 0.55) 0%, transparent 45%),
        radial-gradient(circle at 28% 78%, rgba(18, 122, 150, 0.52) 0%, transparent 36%),
        radial-gradient(circle at 22% 72%, rgba(88, 182, 201, 0.45) 0%, transparent 42%),
        radial-gradient(circle at 15% 15%, rgba(232, 243, 242, 0.9) 0%, transparent 48%),
        linear-gradient(135deg, #e8f3f2 0%, #d6e2f5 45%, #c5daf4 100%);
      filter: blur(14px);
      transform: scale(1.06);
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="watercolor-bg"></div>

  <div class="stage" id="stage">
    <section class="scene active" data-scene="0">
      <!-- আপনার সিন ১-এর কন্টেন্ট এখানে যুক্ত হবে -->
    </section>
  </div>

  <script>
    const stage = document.getElementById('stage');
  </script>
</body>
</html>
