<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>index.html - Dark Wood Plank Background</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0e0e0e;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ডার্ক কাঠের তক্তা ও ভিননেট ব্যাকগ্রাউন্ড লেয়ার */
    .wood-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.72) 85%),
        repeating-linear-gradient(
          90deg,
          #191919 0px,
          #222222 18px,
          #161616 36px,
          #252525 54px,
          #1c1c1c 70px,
          #0c0c0c 72px
        );
    }

    /* সূক্ষ্ম উড-গ্রেইন টেক্সচার ওভারলে */
    .wood-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.025) 0px 2px,
        transparent 2px 9px,
        rgba(0, 0, 0, 0.25) 9px 11px
      );
      opacity: 0.75;
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="wood-bg"></div>

  <div class="stage" id="stage">
    <section class="scene active" data-scene="0">
      <!-- আপনার সিন ১-এর কন্টেন্ট এখানে যুক্ত হবে -->
    </section>
  </div>

  <script>
    const stage = document.getElementById('stage');
  </script>
</body>
</html>
