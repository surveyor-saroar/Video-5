<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>index.html - Gradient Background Stage</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(90deg, #40C9FF, #E81CFF);
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      color: #ffffff;
      padding: 20px;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene {
      position: absolute;
      inset: 0;
      padding: 44px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <section class="scene active" data-scene="0">
      <!-- আপনার সিন ১-এর কন্টেন্ট এখানে যুক্ত হবে -->
    </section>
  </div>

  <script>
    const stage = document.getElementById('stage');
  </script>
</body>
</html>
