<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>index.html - Blue Sunburst Background</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0A2472;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
      background:
        radial-gradient(circle at 50% 25%, transparent 35%, rgba(6, 18, 58, 0.65) 100%),
        repeating-conic-gradient(
          from 0deg at 50% 0%,
          #1D5FD6 0deg 5deg,
          #0E3596 5deg 10deg
        );
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <section class="scene active" data-scene="0">
      <!-- আপনার সিন ১-এর কন্টেন্ট এখানে যুক্ত হবে -->
    </section>
  </div>

  <script>
    const stage = document.getElementById('stage');
  </script>
</body>
</html>
