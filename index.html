<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>index.html - 9:16 Digital Growth Reel</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #04122b;
      --bg-mid: #082759;
      --glow-cyan: #22e6ff;
      --glow-blue: #258cff;
      --card-glass: rgba(8, 35, 78, 0.58);
      --text-light: #f8fafc;
      --text-muted: #cbd5e1;
      --accent-yellow: #ffd24c;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --sync-duration: 3.4s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background:
        radial-gradient(circle at 22% 18%, rgba(34, 230, 255, 0.20), transparent 45%),
        radial-gradient(circle at 80% 78%, rgba(37, 140, 255, 0.24), transparent 50%),
        linear-gradient(155deg, #020817 0%, #071b3d 55%, #031024 100%);
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      color: var(--text-light);
      padding: 12px;
    }

    .reel-stage {
      position: relative;
      height: min(83vh, 780px);
      aspect-ratio: 9 / 16;
      max-width: 94vw;
      border-radius: 26px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 22%, rgba(34, 230, 255, 0.22), transparent 52%),
        linear-gradient(180deg, #07224d 0%, #051636 52%, #030e24 100%);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* সূক্ষ্ম গ্রিড ও ভাসমান কণা */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(125, 211, 252, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(125, 211, 252, 0.06) 1px, transparent 1px);
      background-size: 38px 38px;
      pointer-events: none;
      z-index: 1;
    }

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(186, 230, 253, 0.75);
      box-shadow: 0 0 8px rgba(34, 230, 255, 0.7);
      animation: floatDot linear infinite;
    }

    @keyframes floatDot {
      0% { transform: translateY(18px) scale(0.8); opacity: 0.25; }
      50% { opacity: 0.85; }
      100% { transform: translateY(-24px) scale(1.1); opacity: 0.25; }
    }

    .tap-indicator {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 30;
      background: rgba(3, 14, 36, 0.82);
      backdrop-filter: blur(8px);
      color: #f8fafc;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.22s ease, transform 0.22s var(--ease-out);
      pointer-events: none;
    }

    .tap-indicator.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ক্লিন শট + সফট গ্লো/ফেড ট্রানজিশন */
    .scene {
      position: absolute;
      inset: 0;
      padding: 28px 20px 132px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      opacity: 0;
      z-index: 3;
      pointer-events: none;
      transition: opacity 0.35s var(--ease-out);
    }

    .scene.active {
      opacity: 1;
      z-index: 5;
      pointer-events: auto;
    }

    .pill-title {
      align-self: center;
      display: inline-block;
      padding: 6px 20px;
      border-radius: 999px;
      background: rgba(6, 36, 82, 0.72);
      border: 1.5px solid rgba(34, 230, 255, 0.75);
      box-shadow: 0 0 18px rgba(34, 230, 255, 0.35), inset 0 0 12px rgba(34, 230, 255, 0.22);
      font-size: clamp(1rem, 2.3vh, 1.28rem);
      font-weight: 700;
      color: #ffffff;
      opacity: 0;
      transform: translateY(10px) scale(0.96);
      transition: opacity 0.35s var(--ease-out), transform 0.4s var(--ease-out);
    }

    .scene.active .pill-title {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .service-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .service-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--card-glass);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.35s var(--ease-out), transform 0.4s var(--ease-out), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .scene.active .service-card {
      opacity: 1;
      transform: translateY(0);
    }

    .service-card.lit {
      border-color: rgba(34, 230, 255, 0.95);
      box-shadow: 0 0 22px rgba(34, 230, 255, 0.42), inset 0 0 14px rgba(34, 230, 255, 0.16);
      background: rgba(10, 48, 106, 0.78);
    }

    .icon-box {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: rgba(34, 230, 255, 0.14);
      color: #67e8f9;
      font-size: 1.05rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .service-label {
      font-size: clamp(1rem, 2.2vh, 1.22rem);
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(34, 230, 255, 0.25);
    }

    .result-rows {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 10px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s var(--ease-out), transform 0.4s var(--ease-out);
    }

    .scene.active .result-item.show {
      opacity: 1;
      transform: translateY(0);
    }

    .ring-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #22e6ff;
      box-shadow: 0 0 14px rgba(34, 230, 255, 0.55);
      display: grid;
      place-items: center;
      color: #67e8f9;
      font-size: 0.9rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .result-text {
      font-size: clamp(1.22rem, 2.7vh, 1.58rem);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(34, 230, 255, 0.72), 0 0 6px rgba(34, 230, 255, 0.45);
    }

    .wave-svg {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 118px;
      width: 100%;
      height: 110px;
      pointer-events: none;
      z-index: 4;
    }

    .wave-path {
      fill: none;
      stroke: #22e6ff;
      stroke-width: 3.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 10px rgba(34, 230, 255, 0.8));
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      transition: stroke-dashoffset calc(var(--sync-duration) * 0.75) var(--ease-out);
    }

    .scene.active .wave-path {
      stroke-dashoffset: 0;
    }

    .pillar-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .pillar-line {
      font-size: clamp(1.42rem, 3.2vh, 1.95rem);
      font-weight: 800;
      color: #ffffff;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s var(--ease-out), transform 0.4s var(--ease-out);
    }

    .pillar-line.show {
      opacity: 1;
      transform: translateY(0);
    }

    .pillar-line.glow-cyan {
      color: #7df9ff;
      text-shadow: 0 0 18px rgba(34, 230, 255, 0.75);
    }

    .bar-chart-wrap {
      position: relative;
      height: 135px;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      gap: 10px;
      padding: 12px 10px 4px;
      margin-top: 8px;
    }

    .bar-col {
      flex: 1;
      height: var(--h);
      border-radius: 8px 8px 0 0;
      background: linear-gradient(180deg, #38bdf8 0%, #1d4ed8 100%);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.55s var(--ease-out);
    }

    .scene.active .bar-col.grow {
      transform: scaleY(1);
    }

    .trend-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .trend-line {
      stroke-dasharray: 460;
      stroke-dashoffset: 460;
      transition: stroke-dashoffset 0.75s var(--ease-out) 0.35s;
    }

    .scene.active .trend-line.draw {
      stroke-dashoffset: 0;
    }

    .outro-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
    }

    .brand-badge {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #e0f2fe 72%, #38bdf8 100%);
      border: 4px solid #ffffff;
      box-shadow: 0 0 28px rgba(34, 230, 255, 0.65), 0 14px 30px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #07224d;
      transform: scale(0.84);
      opacity: 0;
      transition: transform 0.5s var(--ease-out), opacity 0.4s var(--ease-out);
    }

    .scene.active .brand-badge {
      transform: scale(1);
      opacity: 1;
    }

    .brand-mark {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
      color: #0b3b8c;
    }

    .brand-sub {
      font-size: 0.66rem;
      font-weight: 800;
      color: #0369a1;
      margin-top: 3px;
    }

    /* কারাওকে ক্যাপশন কার্ড (সম্পূর্ণ নিঃশব্দ, কোনো সাউন্ড নেই) */
    #bottom-caption {
      position: absolute;
      left: 50%;
      bottom: clamp(46px, 0.85in, 86px);
      transform: translateX(-50%);
      width: 90%;
      padding: 8px 12px;
      border-radius: 13px;
      background: rgba(3, 14, 36, 0.34);
      backdrop-filter: blur(8px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px 6px;
      z-index: 22;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
    }

    .cap-word {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: clamp(0.86rem, 1.65vh, 1.04rem);
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.18s var(--ease-out);
    }

    .cap-word.spoken {
      color: #e2e8f0;
      opacity: 0.9;
    }

    .cap-word.active-word {
      background-color: var(--accent-yellow);
      color: #0f172a;
      text-shadow: none;
      transform: translateY(-2px) scale(1.04);
    }

    #bottom-caption.no-highlight .cap-word.active-word {
      background-color: transparent;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      transform: none;
    }

    .hud-bar {
      width: min(94vw, 560px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
    }

    .progress-wrap {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22e6ff, #38bdf8, #ffd24c);
      border-radius: 999px;
      transition: width 0.20s linear;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .counter-badge {
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      padding: 5px 11px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 5px 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(15, 23, 42, 0.88);
      color: #f8fafc;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn:hover { background: #1e293b; }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: #0284c7; color: #ffffff; }
    .btn.primary:hover { background: #0369a1; }
    .btn.active-toggle { background: #ffd24c; color: #0f172a; }

    .dropper-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="reel-stage" id="stage" title="টাচ/ক্লিক করলে অটো চালু বা বন্ধ হবে">
    <div class="grid-overlay"></div>
    <div class="particles" id="particles"></div>
    <div class="tap-indicator" id="tapIndicator">▶ অটো চালু</div>

    <!-- Scene 01: আমাদের সার্ভিস -->
    <section class="scene active" data-scene="0">
      <div class="pill-title">আমাদের সার্ভিস</div>
      <div class="service-list">
        <div class="service-card" data-idx="0">
          <div class="icon-box">❖</div>
          <div class="service-label">সোশ্যাল মিডিয়া মার্কেটিং</div>
        </div>
        <div class="service-card" data-idx="1">
          <div class="icon-box">◎</div>
          <div class="service-label">পেইড অ্যাড ক্যাম্পেইন</div>
        </div>
        <div class="service-card" data-idx="2">
          <div class="icon-box">✎</div>
          <div class="service-label">কনটেন্ট ও গ্রাফিক ডিজাইন</div>
        </div>
        <div class="service-card" data-idx="3">
          <div class="icon-box">⚑</div>
          <div class="service-label">ব্র্যান্ডিং ও স্ট্র্যাটেজি</div>
        </div>
      </div>
    </section>

    <!-- Scene 02: ফলাফল -->
    <section class="scene" data-scene="1">
      <div class="pill-title">ফলাফল</div>
      <div class="result-rows">
        <div class="result-item" data-r="0">
          <div class="ring-icon">↗</div>
          <div class="result-text">রিয়েল রিচ</div>
        </div>
        <div class="result-item" data-r="1">
          <div class="ring-icon">↗</div>
          <div class="result-text">রিয়েল লিড</div>
        </div>
        <div class="result-item" data-r="2">
          <div class="ring-icon">↗</div>
          <div class="result-text">রিয়েল রেজাল্ট</div>
        </div>
      </div>
      <svg class="wave-svg" viewBox="0 0 360 110">
        <path class="wave-path" d="M 10 92 Q 95 72, 165 82 T 350 28" />
      </svg>
    </section>

    <!-- Scene 03: স্ট্র্যাটেজি + ক্রিয়েটিভিটি + রেজাল্ট -->
    <section class="scene" data-scene="2">
      <div class="pillar-stack">
        <div class="pillar-line" data-p="0">স্ট্র্যাটেজি</div>
        <div class="pillar-line" data-p="1"><span style="color:#38bdf8;">+</span> ক্রিয়েটিভিটি</div>
        <div class="pillar-line glow-cyan" data-p="2"><span style="color:#38bdf8;">+</span> রেজাল্ট</div>
      </div>

      <div class="bar-chart-wrap" id="barChart">
        <div class="bar-col" style="--h: 22%;"></div>
        <div class="bar-col" style="--h: 40%;"></div>
        <div class="bar-col" style="--h: 58%;"></div>
        <div class="bar-col" style="--h: 76%;"></div>
        <div class="bar-col" style="--h: 96%;"></div>
        <svg class="trend-svg" viewBox="0 0 320 135">
          <polyline class="trend-line" points="28,112 92,92 156,70 220,46 286,18"
            fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="286" cy="18" r="5" fill="#ffffff" />
        </svg>
      </div>
    </section>

    <!-- Scene 04: ফলো করুন / আউটরো -->
    <section class="scene" data-scene="3">
      <div class="outro-box">
        <div class="brand-badge">
          <div class="brand-mark">SN</div>
          <div class="brand-sub">Digital Growth</div>
        </div>
        <div style="font-size: clamp(1.35rem, 2.9vh, 1.75rem); font-weight: 800; text-shadow: 0 2px 14px rgba(0,0,0,0.45);">
          ফেসবুকে ফলো করুন
        </div>
        <div style="font-size: clamp(1.15rem, 2.5vh, 1.45rem); font-weight: 800; color: #e0f2fe;">
          SN Digital <span style="color: #7df9ff;">Growth</span>
        </div>
      </div>
    </section>

    <div id="bottom-caption" aria-live="polite"></div>
  </div>

  <div class="hud-bar">
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="controls-row">
      <span class="counter-badge" id="counter">01 / 04</span>

      <div class="btn-group">
        <button class="btn active-toggle" id="soundBtn" type="button">🔊 সাউন্ড: চালু</button>
        <button class="btn active-toggle" id="autoPlayBtn" type="button">▶ অটো: চালু</button>
        <button class="btn active-toggle" id="highlightBtn" type="button">✨ হাইলাইট: চালু</button>
        <button class="btn" id="dropperBtn" type="button">💧 রঙ</button>
        <input type="color" id="colorPicker" class="dropper-input" value="#ffd24c" />
        <button class="btn primary" id="replayBtn" type="button">↻ Replay</button>
      </div>
    </div>
  </div>

  <script>
    const scenes = Array.from(document.querySelectorAll('.scene'));
    const totalSteps = scenes.length;

    const voiceoverLines = [
      "সঠিক পরিকল্পনায় আপনার ব্যবসাকে এগিয়ে নিন।",
      "ফলাফল, বাড়ছে রিচ, বাড়ছে লিড, বাড়ছে সেলস।",
      "পরিকল্পনা, সৃজনশীলতা আর ডেটার সমন্বয়ে ধাপে ধাপে এগিয়ে যাই।",
      "ফেসবুকে ফলো করুন, এসএন ডিজিটাল গ্রোথ।"
    ];

    function estimateVoiceDurationMs(text) {
      const words = text.trim().split(/\s+/).filter(Boolean);
      return Math.max(3200, words.length * 340);
    }

    // ব্যাকগ্রাউন্ডে ভাসমান কণা তৈরি
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('span');
      p.className = 'particle';
      const sz = 2 + (i % 3);
      p.style.width = `${sz}px`;
      p.style.height = `${sz}px`;
      p.style.left = `${(i * 19) % 96}%`;
      p.style.top = `${(i * 23) % 90}%`;
      p.style.animationDuration = `${4.5 + (i % 4)}s`;
      p.style.animationDelay = `${(i % 5) * 0.4}s`;
      particlesEl.appendChild(p);
    }

    let audioCtx = null;
    let soundEnabled = true;

    function ensureAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    // সফট ট্রানজিশন ও সূক্ষ্ম পপ অ্যাকসেন্ট (ভয়েসওভার বা ক্যাপশন ছাড়া)
    function playSoftTransitionAccent(freqStart = 280, freqEnd = 520, duration = 0.16, peak = 0.04) {
      if (!soundEnabled) return;
      ensureAudioCtx();
      if (!audioCtx || audioCtx.state !== 'running') return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freqStart, now);
      osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(peak, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.01);
    }

    const stageEl = document.getElementById('stage');
    const tapIndicator = document.getElementById('tapIndicator');
    const bottomCaption = document.getElementById('bottom-caption');
    const counterEl = document.getElementById('counter');
    const progressBar = document.getElementById('progressBar');
    const soundBtn = document.getElementById('soundBtn');
    const autoPlayBtn = document.getElementById('autoPlayBtn');
    const replayBtn = document.getElementById('replayBtn');
    const highlightBtn = document.getElementById('highlightBtn');
    const dropperBtn = document.getElementById('dropperBtn');
    const colorPicker = document.getElementById('colorPicker');

    let currentStep = 0;
    let isFirstLoad = true;
    let isAutoPlaying = true;
    let highlightEnabled = true;
    let wordTimer = null;
    let nextSceneTimer = null;
    let indicatorTimer = null;
    let sceneTimers = [];

    function clearAllTimers() {
      clearTimeout(wordTimer);
      clearTimeout(nextSceneTimer);
      sceneTimers.forEach(t => clearTimeout(t));
      sceneTimers = [];
    }

    function showTapStatus(text) {
      tapIndicator.textContent = text;
      tapIndicator.classList.add('show');
      clearTimeout(indicatorTimer);
      indicatorTimer = setTimeout(() => {
        tapIndicator.classList.remove('show');
      }, 1100);
    }

    function syncAutoPlayUI(notifyScreen = false) {
      autoPlayBtn.classList.toggle('active-toggle', isAutoPlaying);
      autoPlayBtn.textContent = isAutoPlaying ? '▶ অটো: চালু' : '⏸ অটো: বন্ধ';
      if (notifyScreen) {
        showTapStatus(isAutoPlaying ? '▶ অটো চালু' : '⏸ অটো বন্ধ');
      }
    }

    function toggleAutoPlay(notifyScreen = true) {
      ensureAudioCtx();
      isAutoPlaying = !isAutoPlaying;
      syncAutoPlayUI(notifyScreen);
      if (isAutoPlaying) {
        goToScene(currentStep);
      } else {
        clearTimeout(nextSceneTimer);
      }
    }

    function updateProgress(stepIdx, wordRatio = 0) {
      const base = stepIdx / totalSteps;
      const slice = (1 / totalSteps) * wordRatio;
      const pct = Math.min(100, Math.max(4, (base + slice) * 100));
      progressBar.style.width = `${pct}%`;
    }

    function scheduleNextScene(stepIdx) {
      clearTimeout(nextSceneTimer);
      if (!isAutoPlaying) return;
      nextSceneTimer = setTimeout(() => {
        goToScene((stepIdx + 1) % totalSteps);
      }, 220);
    }

    // ক্যাপশন কার্ড সম্পূর্ণ নিঃশব্দ — শুধুমাত্র শব্দ হাইলাইট
    function renderKaraokeSynced(text, stepIdx, totalDurationMs) {
      bottomCaption.innerHTML = '';
      const words = text.split(/\s+/).filter(Boolean);
      const wordSpans = words.map((w) => {
        const span = document.createElement('span');
        span.className = 'cap-word';
        span.textContent = w;
        bottomCaption.appendChild(span);
        return span;
      });

      if (!wordSpans.length) return;
      const intervalMs = totalDurationMs / wordSpans.length;
      let wIdx = 0;

      function stepWord() {
        wordSpans.forEach((el, i) => {
          el.classList.remove('active-word');
          el.classList.toggle('spoken', i < wIdx);
        });

        if (wIdx < wordSpans.length) {
          wordSpans[wIdx].classList.add('active-word');
          updateProgress(stepIdx, (wIdx + 1) / wordSpans.length);
          wIdx++;
          wordTimer = setTimeout(stepWord, intervalMs);
        } else {
          updateProgress(stepIdx, 1);
          scheduleNextScene(stepIdx);
        }
      }

      stepWord();
    }

    function animateSceneDetails(stepIdx, syncMs) {
      if (stepIdx === 0) {
        const cards = Array.from(document.querySelectorAll('.service-card'));
        cards.forEach(c => c.classList.remove('lit'));
        const stepGap = Math.max(450, (syncMs - 500) / cards.length);
        cards.forEach((card, i) => {
          const t = setTimeout(() => {
            cards.forEach(x => x.classList.remove('lit'));
            card.classList.add('lit');
            playSoftTransitionAccent(320 + i * 55, 480 + i * 55, 0.11, 0.025);
          }, 250 + i * stepGap);
          sceneTimers.push(t);
        });
      } else if (stepIdx === 1) {
        const items = Array.from(document.querySelectorAll('.result-item'));
        items.forEach(el => el.classList.remove('show'));
        const gap = Math.max(550, (syncMs - 600) / items.length);
        items.forEach((item, i) => {
          const t = setTimeout(() => {
            item.classList.add('show');
            playSoftTransitionAccent(360 + i * 70, 560 + i * 70, 0.12, 0.028);
          }, 220 + i * gap);
          sceneTimers.push(t);
        });
      } else if (stepIdx === 2) {
        const lines = Array.from(document.querySelectorAll('.pillar-line'));
        const bars = Array.from(document.querySelectorAll('.bar-col'));
        const trend = document.querySelector('.trend-line');
        lines.forEach(el => el.classList.remove('show'));
        bars.forEach(b => b.classList.remove('grow'));
        if (trend) trend.classList.remove('draw');

        lines.forEach((line, i) => {
          const t = setTimeout(() => {
            line.classList.add('show');
            playSoftTransitionAccent(300 + i * 80, 520 + i * 80, 0.12, 0.028);
          }, 180 + i * 420);
          sceneTimers.push(t);
        });

        bars.forEach((bar, i) => {
          const t = setTimeout(() => {
            bar.classList.add('grow');
          }, 900 + i * 160);
          sceneTimers.push(t);
        });

        const tLine = setTimeout(() => {
          if (trend) trend.classList.add('draw');
        }, 1650);
        sceneTimers.push(tLine);
      }
    }

    function goToScene(stepIdx) {
      clearAllTimers();
      currentStep = ((stepIdx % totalSteps) + totalSteps) % totalSteps;
      const line = voiceoverLines[currentStep];
      const syncMs = estimateVoiceDurationMs(line);

      document.documentElement.style.setProperty('--sync-duration', `${(syncMs / 1000).toFixed(2)}s`);

      if (isFirstLoad) {
        isFirstLoad = false;
      } else {
        playSoftTransitionAccent(220, 420, 0.18, 0.038);
      }

      scenes.forEach((sc, i) => {
        sc.classList.remove('active');
        void sc.offsetWidth;
        if (i === currentStep) sc.classList.add('active');
      });

      animateSceneDetails(currentStep, syncMs);
      counterEl.textContent = `${String(currentStep + 1).padStart(2, '0')} / ${String(totalSteps).padStart(2, '0')}`;
      renderKaraokeSynced(line, currentStep, syncMs);
    }

    ['pointerdown', 'keydown'].forEach(evt => {
      window.addEventListener(evt, ensureAudioCtx, { once: true });
    });

    stageEl.addEventListener('click', () => {
      toggleAutoPlay(true);
    });

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      soundBtn.classList.toggle('active-toggle', soundEnabled);
      soundBtn.textContent = soundEnabled ? '🔊 সাউন্ড: চালু' : '🔇 সাউন্ড: বন্ধ';
      if (soundEnabled) {
        ensureAudioCtx();
        playSoftTransitionAccent(260, 480, 0.15, 0.035);
      }
    });

    autoPlayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleAutoPlay(true);
    });

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      ensureAudioCtx();
      isAutoPlaying = true;
      syncAutoPlayUI(false);
      goToScene(0);
    });

    highlightBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      highlightEnabled = !highlightEnabled;
      bottomCaption.classList.toggle('no-highlight', !highlightEnabled);
      highlightBtn.classList.toggle('active-toggle', highlightEnabled);
      highlightBtn.textContent = highlightEnabled ? '✨ হাইলাইট: চালু' : '✨ হাইলাইট: বন্ধ';
    });

    dropperBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if ('EyeDropper' in window) {
        try {
          const eyeDropper = new EyeDropper();
          const result = await eyeDropper.open();
          document.documentElement.style.setProperty('--accent-yellow', result.sRGBHex);
          colorPicker.value = result.sRGBHex;
          return;
        } catch (_) {}
      }
      colorPicker.click();
    });

    colorPicker.addEventListener('click', (e) => e.stopPropagation());
    colorPicker.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--accent-yellow', e.target.value);
    });

    goToScene(0);
  </script>
</body>
</html>
